[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "frglib"
description = "Python bindings to SDL3"
# Version comes from Cargo.toml, so there is a single source of truth.
dynamic = ["version"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
]

[tool.maturin]
features = ["pyo3/extension-module"]
