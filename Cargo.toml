[package]
name = "frglib"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "Rust bindings to SDL3: windows, events and a Vulkan-capable surface"
license = "MIT"
repository = "https://github.com/EnotCoder/FRGlib.git"
readme = "README.md"
keywords = ["sdl", "sdl3", "window", "graphics", "vulkan"]
categories = ["graphics", "rendering", "game-development", "api-bindings"]
# A library: whoever pulls this in needs the sources, the readme and the
# licence, and nothing else. The examples stay in the repository but stay out of
# the package -- Cargo drops the `[[example]]` sections whose files `include`
# left behind, so no dangling paths survive in the published manifest.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "logo.svg"]

[features]
default = []
# Build SDL3 from source and link it statically, so the built binary has no
# system SDL3 dependency. Needs cmake and a C compiler. Note that
# `build-from-source` alone is not enough: it still links dynamically, because
# `sdl3-sys` only switches to `LinkKind::Static` under `link-static`.
bundled = ["sdl3/build-from-source-static"]
# Turns on `sdl3/unsafe_textures`, which drops the lifetime from `Texture` so
# that a texture can outlive the frame it was uploaded in -- without it, holding
# one means a self-referential struct, which safe Rust cannot express.
#
# The sdl3 feature admits that a texture may be used with a canvas other than
# the one it came from, which is undefined behaviour. We never do that: a
# `Texture` cannot outlive the window that uploaded it. That guarantee is the
# reason this is opt-in rather than always on, so the crate stays sound for
# everyone who does not ask for it.
cached-textures = ["sdl3/unsafe_textures"]
# A second window flavour that hands the frame to `wgpu` instead of
# `SDL_Renderer`. Opt-in: it pulls in a full GPU stack and the GPU API leaks
# through `frglib::gpu`, so a default build stays as light as it was.
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:glam"]

[dependencies.sdl3]
version = "0.20"
features = ["raw-window-handle"]

# GPU side of `WgpuWindow`. Only the native backends are listed: the default
# feature set also enables the browser backend, which this crate never targets.
[dependencies.wgpu]
version = "30"
optional = true
default-features = false
features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"]

# wgpu's adapter and device requests are futures; this keeps `build()` looking
# like the rest of the crate rather than forcing every caller into async.
[dependencies.pollster]
version = "1"
optional = true

# Plain-old-data vertex and uniform structs, so they can be uploaded as bytes
# without hand-written `unsafe` casts.
[dependencies.bytemuck]
version = "1"
optional = true
features = ["derive"]

# Mat4/Vec3 for the 3D camera. Re-exported through `frglib::gpu`, so callers do
# not have to add it themselves.
[dependencies.glam]
version = "0.34"
optional = true

# Только для примеров, и в публикуемый пакет не попадает: так библиотека не
# тянет за собой SDL3_ttf, а пример с текстом всё равно может им
# воспользоваться.
#
# `build-from-source-static` нужен потому, что SDL3_ttf в системе обычно не
# установлен. Он же пересобирает и сам SDL3, так что первая сборка примера с
# текстом занимает около минуты — плата за то, что у пользователя крейта этой
# зависимости нет.
[dev-dependencies.sdl3]
version = "0.20"
features = ["ttf", "build-from-source-static"]

# Cargo discovers examples only as `examples/*.rs` and `examples/*/main.rs` --
# one level deep. The ones here sit a level deeper (`basic/*.rs`), next to their
# own assets, so they have to be listed by hand. Note that a target name is also
# the binary name, so it cannot contain a `/`; hence `basic-texture` rather than
# `basic/texture`.
[[example]]
name = "basic-draw"
path = "examples/basic/draw.rs"

[[example]]
name = "basic-object"
path = "examples/basic/object.rs"

[[example]]
name = "basic-mouse"
path = "examples/basic/mouse.rs"

[[example]]
name = "basic-polygon"
path = "examples/basic/polygon.rs"

[[example]]
name = "basic-texture"
path = "examples/basic/texture.rs"

[[example]]
name = "basic-window"
path = "examples/basic/window.rs"

[[example]]
name = "basic-camera"
path = "examples/basic/camera.rs"

[[example]]
name = "basic-cached"
path = "examples/basic/cached.rs"
required-features = ["cached-textures"]

[[example]]
name = "basic-animation"
path = "examples/basic/animation.rs"
required-features = ["cached-textures"]

[[example]]
name = "input-relative"
path = "examples/input/relative.rs"

[[example]]
name = "math-lerp"
path = "examples/math/lerp.rs"

[[example]]
name = "math-sin-cos"
path = "examples/math/sin_cos.rs"

[[example]]
name = "math-jumper"
path = "examples/math/jumper.rs"

[[example]]
name = "math-matrix"
path = "examples/math/matrix.rs"

[[example]]
name = "math-aabb"
path = "examples/math/aabb.rs"

[[example]]
name = "ui-button"
path = "examples/ui/button.rs"

[[example]]
name = "ui-slider"
path = "examples/ui/slider.rs"

[[example]]
name = "ui-text"
path = "examples/ui/text.rs"

[[example]]
name = "2d_games-fgoty"
path = "examples/2d_games/fgoty/main.rs"
required-features = ["cached-textures"]

[[example]]
name = "2d_games-fgoty-dash"
path = "examples/2d_games/dash/main.rs"
required-features = ["cached-textures"]

[[example]]
name = "2d_games-gallery"
path = "examples/2d_games/gallery.rs"

[[example]]
name = "2d_games-space"
path = "examples/2d_games/space/main.rs"

[[example]]
name = "wgpu-cube"
path = "examples/wgpu/cube.rs"
required-features = ["wgpu"]

[profile.release]
lto = true
codegen-units = 1
strip = true
