[package]
name = "frglib"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Rust bindings to SDL3: windows, events and a Vulkan-capable surface"
license = "MIT"
repository = "https://github.com/EnotCoder/FRGlib.git"
readme = "README.md"
keywords = ["sdl", "sdl3", "window", "graphics", "vulkan"]
categories = ["graphics", "rendering", "game-development", "api-bindings"]
# A library: whoever pulls this in needs the sources, the readme and the
# licence, and nothing else. The examples stay in the repository but stay out of
# the package -- Cargo drops the `[[example]]` sections whose files `include`
# left behind, so no dangling paths survive in the published manifest.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "logo.svg"]

[features]
default = []
# Build SDL3 from source and link it statically, so the built binary has no
# system SDL3 dependency. Needs cmake and a C compiler. Note that
# `build-from-source` alone is not enough: it still links dynamically, because
# `sdl3-sys` only switches to `LinkKind::Static` under `link-static`.
bundled = ["sdl3/build-from-source-static"]
# Turns on `sdl3/unsafe_textures`, which drops the lifetime from `Texture` so
# that a texture can outlive the frame it was uploaded in -- without it, holding
# one means a self-referential struct, which safe Rust cannot express.
#
# The sdl3 feature admits that a texture may be used with a canvas other than
# the one it came from, which is undefined behaviour. We never do that: a
# `Texture` cannot outlive the window that uploaded it. That guarantee is the
# reason this is opt-in rather than always on, so the crate stays sound for
# everyone who does not ask for it.
cached-textures = ["sdl3/unsafe_textures"]

[dependencies.sdl3]
version = "0.20"
features = ["raw-window-handle"]

# Cargo discovers examples only as `examples/*.rs` and `examples/*/main.rs` --
# one level deep. The ones here sit a level deeper (`basic/*.rs`), next to their
# own assets, so they have to be listed by hand. Note that a target name is also
# the binary name, so it cannot contain a `/`; hence `basic-texture` rather than
# `basic/texture`.
[[example]]
name = "basic-draw"
path = "examples/basic/draw.rs"

[[example]]
name = "basic-object"
path = "examples/basic/object.rs"

[[example]]
name = "basic-mouse"
path = "examples/basic/mouse.rs"

[[example]]
name = "basic-polygon"
path = "examples/basic/polygon.rs"

[[example]]
name = "basic-texture"
path = "examples/basic/texture.rs"

[[example]]
name = "basic-window"
path = "examples/basic/window.rs"

[[example]]
name = "basic-camera"
path = "examples/basic/camera.rs"

[[example]]
name = "basic-cached"
path = "examples/basic/cached.rs"
required-features = ["cached-textures"]

[profile.release]
lto = true
codegen-units = 1
strip = true
