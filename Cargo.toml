[package]
name = "frglib"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Bindings to SDL3 for Python"
license = "MIT"

[lib]
name = "frglib"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build SDL3 from source and link it statically, so the built extension has no
# system SDL3 dependency. Needs cmake and a C compiler. Note that
# `build-from-source` alone is not enough: it still links dynamically, because
# `sdl3-sys` only switches to `LinkKind::Static` under `link-static`.
bundled = ["sdl3/build-from-source-static"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[dependencies.sdl3]
version = "0.20"
features = ["raw-window-handle"]

[profile.release]
lto = true
codegen-units = 1
strip = true
