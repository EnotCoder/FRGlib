# Which game the shared Android project builds.
#
# The paths are relative to the repository root. To build another game, copy
# this file, point `crate` and `assets` at it, and change the identity fields.
# `./build.sh --template` ignores this file and builds the bundled smoke-test
# crate instead.

# Rust cdylib crate with an exported `SDL_main`.
crate=examples/2d_games/space_android

# Folder copied into the APK's `assets/`. Relative paths passed to SDL I/O are
# resolved inside it on Android.
assets=examples/2d_games/assets

# Android application id and the label under the launcher icon.
package=org.frglib.space
app_name=Space

# Screen orientation: landscape, portrait or unspecified.
orientation=landscape

# ABIs to build and package. `x86_64` is for the emulator, `arm64-v8a` for
# phones and tablets.
abis=arm64-v8a,x86_64

# Android API level. SDL3 needs at least 21; 24 keeps the NDK and the Rust
# target on the same page.
min_sdk=24

# Installed NDK. `build.sh` fills this in from ANDROID_NDK_HOME when the value
# is `auto` or empty.
ndk_version=auto
